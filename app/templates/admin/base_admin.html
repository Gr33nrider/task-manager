{% extends "base.html" %}

{% block title %}Админ панель - {{ app_name }}{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <!-- Боковое меню -->
        <div class="col-md-2 p-0">
            <div class="admin-sidebar bg-dark text-white min-vh-100">
                <div class="p-3">
                    <h5 class="text-center mb-3">
                        <i class="bi bi-shield-lock-fill"></i> Админ панель
                    </h5>
                    <hr class="bg-secondary">
                    <nav class="nav flex-column">
                        <a class="nav-link text-white" href="/admin/dashboard">
                            <i class="bi bi-speedometer2"></i> Дашборд
                        </a>
                        <a class="nav-link text-white" href="/admin/users">
                            <i class="bi bi-people-fill"></i> Пользователи
                        </a>
                        <a class="nav-link text-white" href="/admin/projects">
                            <i class="bi bi-folder-fill"></i> Проекты
                        </a>
                        <a class="nav-link text-white" href="/admin/tasks">
                            <i class="bi bi-list-task"></i> Задачи
                        </a>
                    </nav>
                </div>
            </div>
        </div>
        
        <!-- Основной контент -->
        <div class="col-md-10">
            <div class="p-4">
                {% block admin_content %}{% endblock %}
            </div>
        </div>
    </div>
</div>

<style>
    .admin-sidebar {
        position: sticky;
        top: 70px;
        height: calc(100vh - 70px);
    }
    
    .admin-sidebar .nav-link:hover {
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
    }
    
    .admin-sidebar .nav-link i {
        margin-right: 10px;
    }
</style>
<script>
function showNotification(message, type) {
    const notification = document.createElement('div');
    notification.className = `alert alert-${type} alert-dismissible fade show position-fixed top-0 end-0 m-3`;
    notification.style.zIndex = '9999';
    notification.innerHTML = `
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    `;
    document.body.appendChild(notification);
    setTimeout(() => notification.remove(), 3000);
}
</script>
{% endblock %}
